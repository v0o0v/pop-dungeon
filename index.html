<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 모바일 웹뷰 대응: 노치 영역까지 확장 + 핀치/더블탭 줌 차단 (세로 고정) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#161a2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='11' fill='%2333d2bd'/%3E%3Ccircle cx='12' cy='15' r='2.4' fill='%23fff'/%3E%3Ccircle cx='20' cy='15' r='2.4' fill='%23fff'/%3E%3C/svg%3E">
<title>팡팡 던전 · Pop Dungeon</title>
<style>
  /* 모바일 웹뷰 CSS 리셋 (러버밴드/스크롤/탭하이라이트/롱프레스 메뉴 차단) */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed; inset: 0;
    background: #0c0a18;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  #game { width: 100%; height: 100dvh; height: 100svh; }
  /* 스무스/벡터(카툰) 스타일 → 안티앨리어싱 유지(픽셀화 금지) */
  #game canvas { display: block; touch-action: none; image-rendering: auto; }
</style>
</head>
<body>
<div id="game"></div>
<!-- vendored Phaser 4.1.0 (MIT) + 엔진 라이브러리(전부 로컬, 오프라인 동작) -->
<script src="engine/phaser.min.js"></script>
<script src="engine/vectorforge.js"></script>
<!-- 스타일 단일 진실 어댑터(style-architect): data.js POP_STYLE → 팔레트/역할색 조회 -->
<script src="engine/stylekit.js"></script>
<!-- 사운드: Tone.js(v15, MIT) → SoundForge (phaser 다음·game 이전, soundforge 는 tone 다음) -->
<script src="engine/tone.js"></script>
<script src="engine/soundforge.js"></script>
<script src="engine/mobile.js"></script>
<!-- 트윈스틱/아날로그 이동 + 능력 런타임 -->
<script src="engine/joystickkit.js"></script>
<script src="engine/abilitykit.js"></script>
<!-- 게임 데이터(스킬·아이템·사운드 단일 소스) → 게임 -->
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
