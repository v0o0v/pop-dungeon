<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 모바일 웹뷰 대응: 노치 영역까지 확장 + 핀치/더블탭 줌 차단 (세로 고정) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10131f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='8' width='20' height='18' fill='%233fd6a8'/%3E%3Crect x='10' y='13' width='4' height='5' fill='%23fff'/%3E%3Crect x='18' y='13' width='4' height='5' fill='%23fff'/%3E%3Crect x='12' y='15' width='2' height='2' fill='%2315121f'/%3E%3Crect x='20' y='15' width='2' height='2' fill='%2315121f'/%3E%3C/svg%3E">
<title>팡팡 던전 · Pop Dungeon</title>
<style>
  /* 모바일 웹뷰 CSS 리셋 (러버밴드/스크롤/탭하이라이트/롱프레스 메뉴 차단) */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed; inset: 0;
    background: #10131f;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  #game { width: 100%; height: 100dvh; height: 100svh; }
  /* 픽셀(도트) 스타일 → CSS 업스케일도 또렷한 픽셀로(블러 금지) */
  #game canvas { display: block; touch-action: none; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="game"></div>
<!-- vendored Phaser 4.1.0 (MIT) + 엔진 라이브러리(전부 로컬, 오프라인 동작) -->
<script src="engine/phaser.min.js"></script>
<!-- VectorForge 는 캔버스→텍스처 베이크 플럼빙(ss:1)으로만 사용 — 드로잉은 game.js PX 도트 래스터 -->
<script src="engine/vectorforge.js"></script>
<!-- 스타일 단일 진실 어댑터(style-architect): data.js POP_STYLE → 팔레트/역할색 조회 -->
<script src="engine/stylekit.js"></script>
<!-- 사운드: Tone.js(v15, MIT) → SoundForge (phaser 다음·game 이전, soundforge 는 tone 다음) -->
<script src="engine/tone.js"></script>
<script src="engine/soundforge.js"></script>
<script src="engine/mobile.js"></script>
<!-- 트윈스틱/아날로그 이동 + 능력 런타임 -->
<script src="engine/joystickkit.js"></script>
<script src="engine/abilitykit.js"></script>
<!-- 게임 데이터(스킬·아이템·사운드 단일 소스) — data/ 분할(전역 누적, window.POP_*) -->
<script src="data/style.data.js"></script>
<script src="data/abilities.data.js"></script>
<script src="data/items.data.js"></script>
<script src="data/audio.data.js"></script>
<!-- Phase 1 신규 데이터 모듈(월드·NPC·퀘스트·도감·방 템플릿) -->
<script src="data/world.data.js"></script>
<script src="data/npcs.data.js"></script>
<script src="data/quests.data.js"></script>
<script src="data/codex.data.js"></script>
<script src="data/floors/templates.js"></script>
<!-- Phase 3 핸드 디자인 100층 (region 01~10) — Dungeon findFloorData가 수집 -->
<script src="data/floors/region-01.floors.js"></script>
<script src="data/floors/region-02.floors.js"></script>
<script src="data/floors/region-03.floors.js"></script>
<script src="data/floors/region-04.floors.js"></script>
<script src="data/floors/region-05.floors.js"></script>
<script src="data/floors/region-06.floors.js"></script>
<script src="data/floors/region-07.floors.js"></script>
<script src="data/floors/region-08.floors.js"></script>
<script src="data/floors/region-09.floors.js"></script>
<script src="data/floors/region-10.floors.js"></script>
<!-- floors 샘플 층(살아있는 참조) — Dungeon 최후 폴백 데이터원(별도 전역, 중복 없음) -->
<script src="data/floors/region-01.sample.js"></script>
<!-- 게임 코드 — game/ 모듈 분할(전역 누적 window.PD, file:// 안전).
     로드 순서: core(상수·PRNG·상태·헬퍼·config) → art/story/stats → scenes → PD.boot() -->
<script src="game/core.js"></script>
<script src="game/art.js"></script>
<script src="game/story.js"></script>
<script src="game/stats.js"></script>
<!-- 능력 패시브 배선(stats.js 소스[4] 계약: PD.getPassiveEffects) + 세이브 v2 -->
<script src="game/abilities-wiring.js"></script>
<script src="game/save.js"></script>
<!-- 던전 좌표계: Room/Maze 추상화(스파이크) + 타일 물리·렌더 + floor→방 그래프 어댑터(L6a) -->
<script src="game/room.js"></script>
<script src="game/tiles.js"></script>
<script src="game/roomgraph.js"></script>
<!-- 미니맵 렌더러(L6c) — 방 그래프 미니맵(HUD 오버레이) -->
<script src="game/minimap.js"></script>
<script src="game/scenes/Boot.js"></script>
<script src="game/scenes/Title.js"></script>
<!-- 던전 본체(L6a — GameScene 대체: ARENA→room.bounds 좌표계 + 타일 물리) -->
<script src="game/scenes/Dungeon.js"></script>
<script src="game/scenes/HUD.js"></script>
<script src="game/scenes/Result.js"></script>
<!-- Phase 0.5 미로 런타임 스파이크 씬(?spike=1) — 신규 씬, 본편 비침습 -->
<script src="game/scenes/SpikeMaze.js"></script>
<script src="game/scenes/WorldMap.js"></script>
<!-- 마을 기능 UI 모듈(L5) — Modal 기반 모달 6종 + NPC 대화. Village 보다 먼저 로드 -->
<script src="game/ui/Modal.js"></script>
<script src="game/ui/Inventory.js"></script>
<script src="game/ui/Shop.js"></script>
<script src="game/ui/Forge.js"></script>
<script src="game/ui/SkillTree.js"></script>
<script src="game/ui/StatAlloc.js"></script>
<script src="game/ui/QuestBoard.js"></script>
<script src="game/ui/Codex.js"></script>
<script src="game/ui/Dialogue.js"></script>
<!-- 마을 허브 씬(L5) — 솔뫼 마을 NPC 6종 + 출정 -->
<script src="game/scenes/Village.js"></script>
<!-- Capacitor 네이티브 백버튼 정책 (브라우저에서는 no-op) -->
<script src="game/native.js"></script>
<!-- 모든 씬 클래스 등록 후 부팅 트리거(인라인 — file:// 안전) -->
<script>window.PD.boot();</script>
</body>
</html>
